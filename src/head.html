<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:site_name" content="جامع تفسير الشيخين">
<meta property="og:locale" content="ar_AR">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tafsirshaikhain.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
.about-link{font-size:14px;color:var(--muted,#5b6676);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.about-link a{color:var(--lapis,#1f4f8f)}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--lapis,#1f4f8f);text-decoration:underline;cursor:pointer}
.sharebtn{justify-self:start}
.search{flex-wrap:wrap} .search input{flex:1 1 160px} #scope{flex:0 1 auto;max-width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line,#d9dee6);border-radius:8px;background:var(--sheet,#fff);color:var(--ink,#18212e)}
.gres{display:grid;gap:4px;text-align:start;font:inherit;background:var(--sheet,#fff);border:1px solid var(--line,#d9dee6);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink,#18212e)}
.gres:hover{border-color:var(--lapis,#1f4f8f)}
.gres-h{font-size:13px;color:var(--muted,#5b6676)}
.gres-t{font-family:var(--f-read,serif);font-size:17px;line-height:1.9;overflow-wrap:anywhere}
.site-foot{max-width:1100px;margin:24px auto 0;padding:16px;border-top:1px solid var(--line,#d9dee6);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-size:13px;color:var(--muted,#5b6676)}
.site-foot a{color:inherit}
.tr-verse{display:grid;gap:4px;background:var(--saffron-soft,#f6ecdc);border-radius:10px;padding:10px 14px}
.tr-label{font-size:12px;color:var(--muted,#5b6676)}
.tr-text{margin:0;font-size:16.5px;line-height:1.8}
.tr-fn{margin:0;font-size:14px;line-height:1.7;color:var(--muted,#5b6676);white-space:pre-line}
.tr-credit{font-size:12px;color:var(--muted,#5b6676)}
.tr-sum{margin:4px 0 0;font-size:15.5px;line-height:1.8;color:var(--muted,#5b6676);border-inline-start:3px solid var(--line,#d9dee6);padding-inline-start:10px}
.lang-offer{display:flex;gap:8px;align-items:center;justify-content:center;max-width:860px;margin:0 auto 12px;padding:8px 12px;border-radius:10px;background:var(--lapis-soft,#e3ebf6);font-family:system-ui,sans-serif}
.lo-go{font:inherit;font-size:15px;font-weight:600;background:none;border:0;color:var(--lapis,#1f4f8f);cursor:pointer;text-decoration:underline}
.lo-x{font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--muted,#5b6676);cursor:pointer;padding:0 4px}
header.top #langsel{justify-self:end}
#langsel{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line,#d9dee6);border-radius:6px;background:var(--sheet,#fff);color:var(--ink,#18212e)}
</style>
<script src="/i18n.js"></script>
<script src="/qsuggest.js"></script>
{{JSONLD}}
</head>
<body>
